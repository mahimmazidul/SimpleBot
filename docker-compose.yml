services:
  bot:
    build: .
    env_file: .env
    volumes:
      - ./cookies:/app/cookies
      - ./temp:/app/temp
      - ./logs:/app/logs
      - ./data:/app/data
    restart: unless-stopped

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    profiles: ["local-api"]
    environment:
      TELEGRAM_API_ID: ${API_ID}
      TELEGRAM_API_HASH: ${API_HASH}
    command: --local --http-port=8081
    ports:
      - "8081:8081"
    restart: unless-stopped
